<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nand2Tetris 作業集</title>
<style>
  :root {
    --bg: #0f1226;
    --bg-2: #161a36;
    --bg-3: #1d2247;
    --fg: #e6e8f5;
    --muted: #9aa0c2;
    --accent: #7c5cff;
    --accent-2: #2dd4bf;
    --border: #2a2f5a;
    --code-bg: #0a0d1f;
    --danger: #ff7a7a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", Roboto, sans-serif;
    line-height: 1.6;
  }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header.site {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15, 18, 38, 0.85);
    backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--border);
  }
  header.site .inner {
    max-width: 1100px; margin: 0 auto;
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header.site h1 {
    margin: 0; font-size: 1.15rem; letter-spacing: 0.5px;
  }
  header.site h1 .brand {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  header.site .crumbs {
    font-size: 0.9rem; color: var(--muted);
  }
  header.site .crumbs a { color: var(--muted); }
  header.site .crumbs a:hover { color: var(--fg); text-decoration: none; }

  main {
    max-width: 1100px; margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .intro h2 {
    margin: 0 0 8px; font-size: 1.6rem;
  }
  .intro p {
    margin: 0 0 28px; color: var(--muted);
  }

  /* Chapter grid (home) */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
    display: flex; flex-direction: column; gap: 6px;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    background: var(--bg-3);
  }
  .card .num {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--accent-2);
    font-size: 0.85rem;
    letter-spacing: 1px;
  }
  .card .title {
    font-size: 1.05rem; font-weight: 600;
  }
  .card .desc {
    color: var(--muted); font-size: 0.9rem;
  }
  .card.empty .title { color: var(--muted); }
  a.card { color: inherit; }
  a.card:hover { text-decoration: none; }

  /* Chapter view */
  .chapter-header h2 {
    margin: 0 0 4px; font-size: 1.6rem;
  }
  .chapter-header .meta {
    color: var(--muted); margin: 0 0 28px;
  }

  .chip {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 22px;
  }
  .chip h3 {
    margin: 0 0 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 1.15rem;
    color: var(--accent-2);
  }
  .chip .summary {
    color: var(--muted); margin: 0 0 14px; font-size: 0.95rem;
  }
  .chip .image {
    margin: 0 0 16px;
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }
  .chip .image img {
    max-width: 100%;
    height: auto;
    border-radius: 4px;
  }
  .chip .image .cap {
    display: block; margin-top: 8px;
    font-size: 0.8rem; color: var(--muted);
  }
  .chip pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.86rem;
    line-height: 1.55;
  }
  .chip pre code { white-space: pre; }

  .back {
    display: inline-block;
    margin-bottom: 18px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .back:hover { color: var(--fg); text-decoration: none; }

  footer.site {
    border-top: 1px solid var(--border);
    color: var(--muted);
    text-align: center;
    padding: 20px 24px;
    font-size: 0.85rem;
  }

  @media (max-width: 600px) {
    main { padding: 24px 14px 60px; }
    header.site .inner { padding: 12px 14px; }
  }
</style>
</head>
<body>
<header class="site">
  <div class="inner">
    <h1><a href="#/" style="color:inherit;text-decoration:none;"><span class="brand">Nand2Tetris</span> 作業集</a></h1>
    <div class="crumbs" id="crumbs"></div>
  </div>
</header>
<main id="app"></main>
<footer class="site">
  <div>Nand2Tetris 課程作業 · 馮至豪 · 111410545</div>
</footer>

<script>
/* ---------- Data ---------- */
const CHAPTERS = {
  "01": {
    title: "布林邏輯 (Boolean Logic)",
    desc: "用 Nand 基礎閘組合出所有需要的邏輯閘。",
    chips: [
      { name: "Not", summary: "單輸入反相閘。Nand(in, in) 即為 Not。",
        img: "01/Not.png",
        code:
`CHIP Not {
    IN in;
    OUT out;
    PARTS:
    Nand(a=in, b=in, out=out);
}` },
      { name: "And", summary: "Nand 串接兩次得到 And：a AND b = NOT(NAND(a,b))。",
        img: "01/And.png",
        code:
`CHIP And {
    IN a, b;
    OUT out;
    PARTS:
    Nand(a=a, b=b, out=aNandb);
    Nand(a=aNandb, b=aNandb, out=out);
}` },
      { name: "Or", summary: "透過 De Morgan：a OR b = NOT(NOT a AND NOT b)。",
        img: "01/Or.png",
        code:
`CHIP Or {
    IN a, b;
    OUT out;
    PARTS:
    Not(in=a, out=anot);
    Not(in=b, out=bnot);
    Nand(a=anot, b=bnot, out=out);
}` },
      { name: "Xor", summary: "由 4 個 Nand 構成：a XOR b = NOT(a == b)。",
        img: "01/Xor.png",
        code:
`CHIP Xor {
    IN a, b;
    OUT out;
    PARTS:
    Nand(a=a,    b=b,    out=nand1);
    Nand(a=a,    b=nand1,out=nand2);
    Nand(a=nand1, b=b,    out=nand3);
    Nand(a=nand2, b=nand3,out=out);
}` },
      { name: "And16", summary: "逐位元呼叫 And 16 次組成 16 位元 And。",
        code:
`CHIP And16 {
    IN a[16], b[16];
    OUT out[16];
    PARTS:
    And(a=a[0],  b=b[0],  out=out[0]);
    And(a=a[1],  b=b[1],  out=out[1]);
    /* ... 略, And() x16 ... */
    And(a=a[15], b=b[15], out=out[15]);
}` },
      { name: "Or16", summary: "逐位元呼叫 Or 16 次組成 16 位元 Or。",
        img: "01/Or16.png",
        code:
`CHIP Or16 {
    IN a[16], b[16];
    OUT out[16];
    PARTS:
    Or(a=a[0],  b=b[0],  out=out[0]);
    /* ... 略, Or() x16 ... */
    Or(a=a[15], b=b[15], out=out[15]);
}` },
      { name: "Not16", summary: "逐位元呼叫 Not 16 次組成 16 位元 Not。",
        code:
`CHIP Not16 {
    IN in[16];
    OUT out[16];
    PARTS:
    Not(in=in[0],  out=out[0]);
    /* ... 略, Not() x16 ... */
    Not(in=in[15], out=out[15]);
}` },
      { name: "Mux", summary: "以 sel 選擇 a 或 b：sel=0 選 a；sel=1 選 b。",
        img: "01/Mux.png",
        code:
`CHIP Mux {
    IN a, b, sel;
    OUT out;
    PARTS:
    Not(in=sel, out=nsel);
    And(a=a, b=nsel, out=sel0);
    And(a=b, b=sel,  out=sel1);
    Or (a=sel0, b=sel1, out=out);
}` },
      { name: "DMux", summary: "Demultiplexor：依 sel 將輸入轉送到 a 或 b。",
        img: "01/DMux.png",
        code:
`CHIP DMux {
    IN in, sel;
    OUT a, b;
    PARTS:
    Not(in=sel, out=selout);
    And(a=in, b=selout, out=a);
    And(a=in, b=sel,    out=b);
}` },
      { name: "Mux16", summary: "逐位元呼叫 Mux 16 次組成 16 位元 Mux。",
        img: "01/Mux16.png",
        code:
`CHIP Mux16 {
    IN a[16], b[16], sel;
    OUT out[16];
    PARTS:
    Mux(a=a[0],  b=b[0],  sel=sel, out=out[0]);
    /* ... 略, Mux() x16 ... */
    Mux(a=a[15], b=b[15], sel=sel, out=out[15]);
}` },
      { name: "Or8Way", summary: "8 輸入 OR：以 7 個 Or 兩兩合併成一棵平衡樹。",
        code:
`CHIP Or8Way {
    IN in[8];
    OUT out;
    PARTS:
    Or(a=in[0], b=in[1], out=or01);
    Or(a=in[2], b=in[3], out=or23);
    Or(a=in[4], b=in[5], out=or45);
    Or(a=in[6], b=in[7], out=or67);
    Or(a=or01,  b=or23,  out=or0123);
    Or(a=or45,  b=or67,  out=or4567);
    Or(a=or0123,b=or4567,out=out);
}` },
      { name: "Mux4Way16", summary: "兩階段 Mux16：以 sel[0] 選 a/b、c/d，再以 sel[1] 合併。",
        img: "01/Mux4Way16.png",
        code:
`CHIP Mux4Way16 {
    IN a[16], b[16], c[16], d[16], sel[2];
    OUT out[16];
    PARTS:
    Mux16(a=a, b=b, sel=sel[0], out=a0b1);
    Mux16(a=c, b=d, sel=sel[0], out=c0d1);
    Mux16(a=a0b1, b=c0d1, sel=sel[1], out=out);
}` },
      { name: "DMux4Way", summary: "第一層依 sel[1] 拆上下半，再各自用 sel[0] 拆 a/b、c/d。",
        img: "01/DMux4.png",
        code:
`CHIP DMux4Way {
    IN in, sel[2];
    OUT a, b, c, d;
    PARTS:
    DMux(in=in, sel=sel[1], a=top,    b=bottom);
    DMux(in=top,    sel=sel[0], a=a, b=b);
    DMux(in=bottom, sel=sel[0], a=c, b=d);
}` },
      { name: "Mux8Way16", summary: "兩組 Mux4Way16 各處理 4 路，最後以 sel[2] 合併。",
        code:
`CHIP Mux8Way16 {
    IN a[16], b[16], c[16], d[16],
       e[16], f[16], g[16], h[16], sel[3];
    OUT out[16];
    PARTS:
    Mux4Way16(a=a,b=b,c=c,d=d, sel=sel[0..1], out=lo);
    Mux4Way16(a=e,b=f,c=g,d=h, sel=sel[0..1], out=hi);
    Mux16(a=lo, b=hi, sel=sel[2], out=out);
}` },
      { name: "DMux8Way", summary: "第一層依 sel[2] 拆 top/bottom，再各用 DMux4Way 拆 4 路。",
        img: "01/DMux8Way.png",
        code:
`CHIP DMux8Way {
    IN in, sel[3];
    OUT a, b, c, d, e, f, g, h;
    PARTS:
    DMux(in=in, sel=sel[2], a=top, b=bottom);
    DMux4Way(in=top,    sel=sel[0..1], a=a, b=b, c=c, d=d);
    DMux4Way(in=bottom, sel=sel[0..1], a=e, b=f, c=g, d=h);
}` },
    ],
  },
  "02": {
    title: "布林算術 (Boolean Arithmetic)",
    desc: "從 HalfAdder 出發，逐步建構 ALU。",
    chips: [
      { name: "HalfAdder", summary: "1-bit 加法器：sum = a XOR b；carry = a AND b。",
        img: "02/HalfAdder.png",
        code:
`CHIP HalfAdder {
    IN a, b;
    OUT sum, carry;
    PARTS:
    Xor(a=a, b=b, out=sum);
    And(a=a, b=b, out=carry);
}` },
      { name: "FullAdder", summary: "3-bit 加法器：兩個 HalfAdder + 一個 Or 處理進位。",
        img: "02/FullAdder.png",
        code:
`CHIP FullAdder {
    IN a, b, c;
    OUT sum, carry;
    PARTS:
    HalfAdder(a=a, b=b, sum=sum1, carry=c1);
    HalfAdder(a=sum1, b=c, sum=sum, carry=c2);
    Or(a=c2, b=c1, out=carry);
}` },
      { name: "Add16", summary: "串接 16 個 FullAdder 形成漣波進位加法器，最高位溢位忽略。",
        code:
`CHIP Add16 {
    IN a[16], b[16];
    OUT out[16];
    PARTS:
    FullAdder(a=a[0],  b=b[0],  c=false, sum=out[0],  carry=c0);
    FullAdder(a=a[1],  b=b[1],  c=c0,    sum=out[1],  carry=c1);
    /* ... 略, FullAdder() x16 ... */
    FullAdder(a=a[15], b=b[15], c=c14,   sum=out[15], carry=carry);
}` },
      { name: "Inc16", summary: "在 b 灌入 [1,0,0,...,0]，丟進 Add16 即得到 in+1。",
        code:
`CHIP Inc16 {
    IN in[16];
    OUT out[16];
    PARTS:
    Add16(a=in, b[0]=true, b[1..15]=false, out=out);
}` },
      { name: "ALU", summary: "HACK CPU 的算術邏輯單元，依 zx/nx/zy/ny/f/no 6 個控制訊號產生 18 種運算；zr=輸出為 0、ng=最高位元為 1。",
        img: ["02/螢幕截圖 2021-10-07 上午9.51.16.png"],
        code:
`CHIP ALU {
    IN x[16], y[16],
        zx, nx, zy, ny, f, no;
    OUT out[16], zr, ng;
    PARTS:
    /* zx / nx */
    Mux16(a=x, b=false, sel=zx, out=x1);
    Not16(in=x1, out=notx1);
    Mux16(a=x1, b=notx1, sel=nx, out=x2);

    /* zy / ny */
    Mux16(a=y, b=false, sel=zy, out=y1);
    Not16(in=y1, out=noty1);
    Mux16(a=y1, b=noty1, sel=ny, out=y2);

    /* f, no, zr, ng 接續於課本指定流程 */
    /* (Add16 / And16 / Not16 / Or16Ways ... etc.) */
}` },
    ],
  },
};

/* ---------- Stub chapters ---------- */
const STUBS = [
  "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13",
];
const STUB_TITLES = {
  "03": "時序邏輯 (Sequential Logic)",
  "04": "機器語言 (Machine Language)",
  "05": "電腦架構 (Computer Architecture)",
  "06": "組譯器 (Assembler)",
  "07": "VM I：堆疊算術",
  "08": "VM II：程式控制",
  "09": "高階語言 (High-Level Language)",
  "10": "編譯器 I：語法分析",
  "11": "編譯器 II：程式生成",
  "12": "作業系統 (Operating System)",
  "13": "最終專題：俄羅斯方塊",
};
STUBS.forEach(n => {
  CHAPTERS[n] = {
    title: STUB_TITLES[n] || `第 ${n} 章`,
    desc: "尚待整理。",
    chips: [],
    stub: true,
  };
});

/* ---------- Router ---------- */
const app = document.getElementById("app");
const crumbs = document.getElementById("crumbs");

function setCrumbs(parts) {
  crumbs.innerHTML = parts
    .map((p, i) => {
      const last = i === parts.length - 1;
      return last
        ? `<span>${escapeHtml(p.label)}</span>`
        : `<a href="${p.href}">${escapeHtml(p.label)}</a> &raquo; `;
    })
    .join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function encodeImgPath(p) {
  return p.split("/").map(encodeURIComponent).join("/");
}

function renderHome() {
  setCrumbs([{ label: "首頁" }]);
  const keys = Object.keys(CHAPTERS).sort();
  const cards = keys.map(k => {
    const c = CHAPTERS[k];
    const cls = c.stub ? "card empty" : "card";
    const body = `
      <div class="num">CH ${k}</div>
      <div class="title">${escapeHtml(c.title)}</div>
      <div class="desc">${escapeHtml(c.desc)}</div>
    `;
    return c.stub
      ? `<div class="${cls}">${body}</div>`
      : `<a class="${cls}" href="#/${k}">${body}</a>`;
  }).join("");

  app.innerHTML = `
    <section class="intro">
      <h2>課程作業總覽</h2>
      <p>點選任一章節瀏覽對應的 HDL / 程式碼與截圖；尚未整理的章節目前僅顯示標題。</p>
    </section>
    <section class="grid">${cards}</section>
  `;
}

function renderChapter(num) {
  const c = CHAPTERS[num];
  if (!c) {
    app.innerHTML = `<p>找不到章節 <code>${escapeHtml(num)}</code>。<a href="#/">回首頁</a></p>`;
    setCrumbs([
      { label: "首頁", href: "#/" },
      { label: num },
    ]);
    return;
  }
  setCrumbs([
    { label: "首頁", href: "#/" },
    { label: `CH ${num}` },
  ]);

  const chips = (c.chips || []).map(ch => {
    const imgs = Array.isArray(ch.img) ? ch.img : (ch.img ? [ch.img] : []);
    const imgBlock = imgs.length
      ? `<div class="image">${imgs.map(p =>
          `<img src="${encodeImgPath(p)}" alt="${escapeHtml(ch.name)} 截圖" loading="lazy" />`
        ).join("")}<span class="cap">${imgs.map(p => escapeHtml(p)).join(" · ")}</span></div>`
      : "";

    return `
      <article class="chip">
        <h3>${escapeHtml(ch.name)}</h3>
        <p class="summary">${escapeHtml(ch.summary)}</p>
        ${imgBlock}
        <pre><code>${escapeHtml(ch.code)}</code></pre>
      </article>
    `;
  }).join("");

  app.innerHTML = `
    <a class="back" href="#/">&larr; 回首頁</a>
    <section class="chapter-header">
      <h2>CH ${num} — ${escapeHtml(c.title)}</h2>
      <p class="meta">${escapeHtml(c.desc)}</p>
    </section>
    ${chips || '<p style="color:var(--muted)">本章節尚未整理內容。</p>'}
  `;

  // Scroll to top on chapter change
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function route() {
  const hash = location.hash || "#/";
  const m = hash.match(/^#\/(\d{2})$/);
  if (m) renderChapter(m[1]);
  else renderHome();
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
